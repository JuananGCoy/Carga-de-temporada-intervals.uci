name: Envio Automatico de Informes Intervals.icu

on:
  schedule:
    # Cada domingo a las 20:00 UTC (21:00 / 22:00 hora peninsular española)
    - cron: '0 20 * * 0'
    # Final de cada mes a las 20:00 UTC (los días 28, 29, 30 y 31; el script comprueba si es el último día)
    - cron: '0 20 28-31 * *'
  # Permite ejecutar el envío manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de informe a enviar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - weekly
          - monthly
      force:
        description: 'Forzar envío sin comprobar día'
        required: false
        default: true
        type: boolean

jobs:
  send-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar envío de informes
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python send_reports.py --mode ${{ inputs.mode }} ${{ inputs.force && '--force' || '' }}
          else
            python send_reports.py --mode auto
          fi

      - name: Guardar registro de envíos (Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-log
          path: reports_sent.log
          if-no-files-found: ignore
